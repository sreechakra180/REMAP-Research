# =============================================================================
# REMAP-Net: Conda Environment
# =============================================================================
# Create:  conda env create -f environment.yml
# Update:  conda env update -f environment.yml --prune
# Activate: conda activate remap-net
# =============================================================================
name: remap-net

channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults

dependencies:
  # --- Python ---
  - python=3.11

  # --- PyTorch (CUDA 12.1) ---
  - pytorch>=2.1.0
  - torchvision>=0.16.0
  - torchaudio>=2.1.0
  - pytorch-cuda=12.1

  # --- Scientific Computing ---
  - numpy>=1.24.0
  - scipy>=1.11.0
  - scikit-learn>=1.3.0

  # --- Visualization ---
  - matplotlib>=3.8.0
  - seaborn>=0.13.0

  # --- Build Tools ---
  - pip
  - setuptools>=68.0
  - wheel>=0.41.0

  # --- pip-only packages ---
  - pip:
      - pytorch-lightning>=2.1.0
      - hydra-core>=1.3.0
      - omegaconf>=2.3.0
      - wandb>=0.16.0
      - mlflow>=2.9.0
      - tensorboard>=2.15.0
      - transformers>=4.35.0
      - "ray[tune]>=2.9.0"
      - einops>=0.7.0
      - higher>=0.2.1
      - tqdm>=4.66.0
      - rich>=13.7.0
      - umap-learn>=0.5.0
      - pytest>=7.4.0
      - pytest-cov>=4.1.0
      - black>=23.0
      - isort>=5.12.0
      - ruff>=0.1.0
      - pre-commit>=3.5.0
      - -e .
